<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатори 2 - Семантик HTML Форм</title>
</head>
<body>

    <header>
        <h1>Оюутны бүртгэлийн анкет</h1>
        <p>Лабораторийн ажил №2: Семантик HTML форм хөгжүүлэлт</p>
    </header>

    <main>
        <section>
            <h2>Хувийн мэдээлэл цуглуулах форм</h2>
            
            <form action="#" method="POST">
                
                <!-- Ерөнхий мэдээлэл -->
                <fieldset>
                    <legend><strong>1. Ерөнхий мэдээлэл</strong></legend>
                    
                    <p>
                        <label for="fullname">Овог нэр:</label><br>
                        <input type="text" id="fullname" name="fullname" placeholder="М. Энэрэлт" required>
                    </p>

                    <p>
                        <label for="email">Цахим хаяг (Email):</label><br>
                        <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                    </p>

                    <p>
                        <label for="phone">Утасны дугаар:</label><br>
                        <input type="tel" id="phone" name="phone" placeholder="99112233" pattern="[0-9]{8}" required>
                    </p>

                    <p>
                        <label for="birthdate">Төрсөн огноо:</label><br>
                        <input type="date" id="birthdate" name="birthdate" required>
                    </p>

                    <p>
                        <label>Хүйс:</label><br>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Эрэгтэй</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Эмэгтэй</label>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Бусад</label>
                    </p>
                </fieldset>

                <br>

                <!-- Сургууль ба Мэргэжил -->
                <fieldset>
                    <legend><strong>2. Сургууль & Мэргэжил</strong></legend>

                    <p>
                        <label for="degree">Боловсролын түвшин:</label><br>
                        <select id="degree" name="degree">
                            <option value="bachelor">Бакалавр</option>
                            <option value="master">Магистр</option>
                            <option value="doctor">Доктор</option>
                        </select>
                    </p>

                    <p>
                        <label>Сонирхож буй чиглэлүүд:</label><br>
                        <input type="checkbox" id="frontend" name="interest" value="frontend">
                        <label for="frontend">Front-End хөгжүүлэлт</label><br>
                        <input type="checkbox" id="backend" name="interest" value="backend">
                        <label for="backend">Back-End хөгжүүлэлт</label><br>
                        <input type="checkbox" id="uiux" name="interest" value="uiux">
                        <label for="uiux">UI/UX Загварчлал</label>
                    </p>

                    <p>
                        <label for="bio">Өөрийн тухай товч мэдээлэл:</label><br>
                        <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Мэдээллээ энд бичнэ үү..."></textarea>
                    </p>
                </fieldset>

                <br>

                <!-- Товчлуурууд -->
                <div>
                    <button type="submit">Бүртгүүлэх</button>
                    <button type="reset">Арилгах</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <hr>
        <p>© 2026 М. Энэрэлт | Вэб зохиомж ба хөгжүүлэлт</p>
    </footer>

</body>
</html>
